<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      scroll-behavior: smooth;
    }

    :root {
      --pink: #e75480;
      --pink-light: #fff0f5;
      --purple: #8b5cf6;
      --dark: #25212b;
      --gray: #6f6877;
      --white: #ffffff;
      --bg: #fff9fc;
      --border: #eadde5;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--dark);
      line-height: 1.6;
    }

    /* NAVBAR */

    nav {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 75px;
      padding: 0 8%;
      display: flex;
      align-items: center;
      justify-content: space-between;

      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(12px);

      border-bottom: 1px solid var(--border);
      z-index: 1000;
    }

    .logo {
      font-size: 25px;
      font-weight: bold;
      color: var(--dark);
    }

    .logo span {
      color: var(--pink);
    }

    .nav-links {
      display: flex;
      gap: 30px;
      list-style: none;
    }

    .nav-links a {
      text-decoration: none;
      color: var(--dark);
      font-size: 14px;
      font-weight: bold;
      transition: 0.3s;
    }

    .nav-links a:hover {
      color: var(--pink);
    }

    .menu-btn {
      display: none;
      border: none;
      background: transparent;
      font-size: 25px;
      cursor: pointer;
      color: var(--dark);
    }

    /* HERO */

    .hero {
      min-height: 100vh;
      padding: 130px 8% 80px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 60px;

      background:
        radial-gradient(
          circle at 85% 20%,
          rgba(231, 84, 128, 0.18),
          transparent 30%
        ),
        linear-gradient(
          135deg,
          #fff9fc,
          #ffffff
        );
    }

    .hero-text {
      max-width: 650px;
    }

    .small-title {
      color: var(--pink);
      font-size: 15px;
      font-weight: bold;
      letter-spacing: 3px;
      margin-bottom: 15px;
    }

    .hero h1 {
      font-size: clamp(45px, 7vw, 80px);
      line-height: 1.05;
      margin-bottom: 20px;
    }

    .hero h1 span {
      color: var(--pink);
    }

    .hero h2 {
      font-size: 24px;
      margin-bottom: 20px;
      color: var(--purple);
    }

    .hero-description {
      color: var(--gray);
      max-width: 580px;
      font-size: 16px;
    }

    .hero-buttons {
      display: flex;
      gap: 15px;
      margin-top: 30px;
    }

    .btn {
      padding: 14px 24px;
      border-radius: 30px;
      text-decoration: none;
      font-weight: bold;
      transition: 0.3s;
    }

    .btn-primary {
      background: var(--pink);
      color: white;
      box-shadow: 0 10px 25px rgba(231, 84, 128, 0.25);
    }

    .btn-primary:hover {
      transform: translateY(-4px);
    }

    .btn-secondary {
      border: 1px solid var(--border);
      color: var(--dark);
      background: white;
    }

    .btn-secondary:hover {
      border-color: var(--pink);
      color: var(--pink);
    }

    /* PROFILE CARD */

    .profile-card {
      width: 330px;
      padding: 35px;

      background: white;
      border: 1px solid var(--border);
      border-radius: 30px;

      text-align: center;

      box-shadow: 0 20px 50px rgba(80, 50, 70, 0.08);

      animation: float 4s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-10px);
      }
    }

    .profile-circle {
      width: 150px;
      height: 150px;

      margin: auto;

      border-radius: 50%;

      display: flex;
      align-items: center;
      justify-content: center;

      background: linear-gradient(
        135deg,
        var(--pink),
        var(--purple)
      );

      color: white;

      font-size: 55px;
      font-weight: bold;

      box-shadow: 0 15px 35px rgba(139, 92, 246, 0.25);
    }

    .profile-card h3 {
      margin-top: 25px;
      font-size: 22px;
    }

    .profile-card p {
      color: var(--pink);
      margin-top: 5px;
      font-weight: bold;
    }

    .interest-list {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 25px;
    }

    .interest {
      padding: 10px;
      border-radius: 12px;
      background: var(--pink-light);
      color: var(--dark);
      font-size: 13px;
    }

    /* GENERAL SECTIONS */

    section {
      padding: 100px 8%;
    }

    .section-heading {
      margin-bottom: 45px;
    }

    .section-heading p {
      color: var(--pink);
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 3px;
      margin-bottom: 8px;
    }

    .section-heading h2 {
      font-size: 45px;
    }

    .section-heading h2 span {
      color: var(--pink);
    }

    /* ABOUT */

    #about {
      background: white;
    }

    .about-container {
      display: grid;
      grid-template-columns: 1.3fr 1fr;
      gap: 30px;
    }

    .about-card {
      background: var(--bg);
      padding: 35px;
      border-radius: 25px;
      border: 1px solid var(--border);
    }

    .about-card h3 {
      font-size: 25px;
      margin-bottom: 18px;
    }

    .about-card p {
      color: var(--gray);
      margin-bottom: 15px;
    }

    .info-list {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .info-item {
      display: flex;
      justify-content: space-between;
      padding-bottom: 15px;
      border-bottom: 1px solid var(--border);
      gap: 20px;
    }

    .info-item strong {
      color: var(--pink);
    }

    .info-item span {
      text-align: right;
      color: var(--gray);
    }

    /* EDUCATION */

    .education-card {
      background: white;
      border: 1px solid var(--border);
      padding: 35px;
      border-radius: 25px;
      display: flex;
      gap: 25px;
      align-items: center;
      box-shadow: 0 10px 30px rgba(50, 30, 50, 0.05);
    }

    .education-icon {
      min-width: 75px;
      height: 75px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 20px;

      background: var(--pink-light);
      font-size: 32px;
    }

    .education-card h3 {
      margin-bottom: 5px;
      font-size: 23px;
    }

    .education-card p {
      color: var(--gray);
    }

    /* TECH STACK */

    #skills {
      background: #fff4f8;
    }

    .skills-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
    }

    .skill-card {
      background: white;
      padding: 25px;
      border-radius: 20px;
      border: 1px solid var(--border);
      transition: 0.3s;
    }

    .skill-card:hover {
      transform: translateY(-7px);
      box-shadow: 0 15px 30px rgba(231, 84, 128, 0.1);
    }

    .skill-icon {
      font-size: 30px;
      margin-bottom: 15px;
    }

    .skill-card h3 {
      margin-bottom: 12px;
    }

    .skill-card p {
      color: var(--gray);
      font-size: 13px;
      margin-bottom: 12px;
    }

    .skill-bar {
      height: 7px;
      background: #eee5eb;
      border-radius: 20px;
      overflow: hidden;
    }

    .skill-progress {
      height: 100%;
      background: linear-gradient(
        90deg,
        var(--pink),
        var(--purple)
      );
      border-radius: 20px;
    }

    /* PROJECTS */

    .projects-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 25px;
    }

    .project-card {
      background: white;
      border: 1px solid var(--border);
      border-radius: 25px;
      padding: 30px;
      transition: 0.3s;
      box-shadow: 0 10px 25px rgba(50, 30, 50, 0.04);
    }

    .project-card:hover {
      transform: translateY(-8px);
      border-color: var(--pink);
    }

    .project-number {
      font-size: 45px;
      font-weight: bold;
      color: #f3dce5;
      margin-bottom: 15px;
    }

    .project-card h3 {
      font-size: 22px;
      margin-bottom: 12px;
    }

    .project-card p {
      color: var(--gray);
      font-size: 14px;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 20px;
    }

    .tag {
      padding: 6px 12px;
      border-radius: 20px;
      background: var(--pink-light);
      color: var(--pink);
      font-size: 12px;
      font-weight: bold;
    }

    /* CONTACT */

    #contact {
      background: #fff4f8;
    }

    .contact-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 50px;
    }

    .contact-text h3 {
      font-size: 32px;
      margin-bottom: 15px;
    }

    .contact-text > p {
      color: var(--gray);
    }

    .contact-item {
      display: flex;
      gap: 15px;
      margin-top: 25px;
      align-items: center;
    }

    .contact-icon {
      width: 45px;
      height: 45px;

      display: flex;
      align-items: center;
      justify-content: center;

      background: white;
      border-radius: 12px;

      border: 1px solid var(--border);
    }

    .contact-item strong {
      color: var(--pink);
      font-size: 13px;
    }

    .contact-item p {
      color: var(--gray);
    }

    .contact-form {
      background: white;
      padding: 30px;
      border-radius: 25px;
      border: 1px solid var(--border);
    }

    .contact-form input,
    .contact-form textarea {
      width: 100%;
      padding: 14px 16px;
      margin-bottom: 15px;

      border: 1px solid var(--border);
      border-radius: 12px;

      outline: none;
      font-family: inherit;
      font-size: 14px;
    }

    .contact-form input:focus,
    .contact-form textarea:focus {
      border-color: var(--pink);
    }

    .send-btn {
      width: 100%;
      padding: 14px;

      border: none;
      border-radius: 12px;

      background: var(--pink);
      color: white;

      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    .send-btn:hover {
      background: var(--purple);
    }

    /* FOOTER */

    footer {
      padding: 30px 8%;
      background: white;
      border-top: 1px solid var(--border);

      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }

    footer p {
      color: var(--gray);
      font-size: 13px;
    }

    .socials {
      display: flex;
      gap: 18px;
    }

    .socials a {
      color: var(--gray);
      text-decoration: none;
      font-size: 13px;
      transition: 0.3s;
    }

    .socials a:hover {
      color: var(--pink);
    }

    /* MOBILE */

    @media (max-width: 950px) {

      .nav-links {
        display: none;
        position: absolute;
        top: 75px;
        left: 0;

        width: 100%;

        flex-direction: column;
        align-items: center;

        padding: 25px;

        background: white;
        border-bottom: 1px solid var(--border);
      }

      .nav-links.active {
        display: flex;
      }

      .menu-btn {
        display: block;
      }

      .hero {
        flex-direction: column;
        text-align: center;
      }

      .hero-description {
        margin: auto;
      }

      .hero-buttons {
        justify-content: center;
      }

      .about-container,
      .contact-container {
        grid-template-columns: 1fr;
      }

      .skills-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .projects-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 600px) {

      nav {
        padding: 0 5%;
      }

      section {
        padding: 75px 5%;
      }

      .hero {
        padding-left: 5%;
        padding-right: 5%;
      }

      .hero h1 {
        font-size: 48px;
      }

      .hero h2 {
        font-size: 20px;
      }

      .profile-card {
        width: 100%;
      }

      .skills-grid {
        grid-template-columns: 1fr;
      }

      .section-heading h2 {
        font-size: 38px;
      }

      .education-card {
        flex-direction: column;
        text-align: center;
      }

      footer {
        flex-direction: column;
        text-align: center;
      }
    }
  </style>
</head>
